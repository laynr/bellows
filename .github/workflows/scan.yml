name: Scan availability

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      months:
        description: "Months ahead to scan"
        default: "12"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan (headful under xvfb — headless is blocked by Imperva)
        run: xvfb-run -a python scanner/scan.py --months "${{ github.event.inputs.months || '12' }}" --out docs/data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/availability.json docs/data/rooms.json
          if git diff --cached --quiet; then
            echo "No availability changes."
          else
            git commit -m "Update availability snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
